# Static server for the topowall web app, served at the site root.
# Runs as an unprivileged user on port 8080 with a read-only root filesystem
# (writable /tmp only). Nothing is logged about visitors.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr error;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  charset utf-8;

  # No access logs: the server keeps no record of who loads the page.
  access_log off;
  log_not_found off;
  server_tokens off;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  # The app only ever sends GET requests without a body.
  client_max_body_size 1k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  large_client_header_buffers 4 8k;
  absolute_redirect off;

  gzip on;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  map $request_method $method_allowed {
    GET 1;
    HEAD 1;
    default 0;
  }

  server {
    listen 8080 default_server;
    root /srv/topowall;
    autoindex off;
    disable_symlinks on;

    # The browser may only load this site's own files; the app's data sources are
    # fetched from https URLs the visitor can see and change in the app.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Cache-Control "no-cache" always;

    if ($method_allowed = 0) {
      return 405;
    }

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      try_files $uri $uri/index.html =404;
    }
  }
}
