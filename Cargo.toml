[workspace]
resolver = "2"
members = ["crates/core", "crates/render", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Erik Gonzalez <dev@gonzalezerik.com>"]
repository = "https://github.com/gonzalezerik/topowall"

[workspace.dependencies]
topowall-core = { path = "crates/core" }
topowall-render = { path = "crates/render" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
png = "0.17"
tiff = "0.9"
rayon = "1"
ureq = "2"
wgpu = "25"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
