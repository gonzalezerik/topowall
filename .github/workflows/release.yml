name: Release

on:
  push:
    tags: ["v*"]
  # Add builds to an existing release. Files the release already has are left
  # untouched; SHA256SUMS and the downloads table gain the new entries.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v0.2.0)"
        required: true
      builds:
        description: "Which builds to add"
        type: choice
        options: [all, musl, windows-arm64]
        default: all

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-22.04,     archive: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, archive: tar.gz }
          - { target: aarch64-apple-darwin,      os: macos-latest,     archive: tar.gz }
          - { target: x86_64-apple-darwin,       os: macos-latest,     archive: tar.gz }
          - { target: x86_64-pc-windows-msvc,    os: windows-latest,   archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p topowall --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          name="topowall-${TARGET}"
          mkdir -p "dist/$name"
          bin=topowall
          case "$TARGET" in *windows*) bin=topowall.exe ;; esac
          cp "target/${TARGET}/release/$bin" "dist/$name/"
          cp LICENSE "dist/$name/"
          cp crates/kit/palettes/LICENSE-tinted-theming "dist/$name/"
          cd dist
          if [ "$ARCHIVE" = zip ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  # Native build on Windows 11 ARM64 (Snapdragon and other ARM PCs).
  build-windows-arm64:
    if: github.event_name == 'push' || inputs.builds == 'all' || inputs.builds == 'windows-arm64'
    runs-on: windows-11-arm
    env:
      TARGET: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: Make sure clang is available (the TLS library needs it on ARM64 Windows)
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "$llvm\clang.exe")) { choco install llvm -y --no-progress }
            Add-Content $env:GITHUB_PATH $llvm
          }
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-pc-windows-msvc
      - name: Build
        run: cargo build --release --locked -p topowall --target aarch64-pc-windows-msvc
      - name: Smoke test
        shell: bash
        run: |
          bin="target/${TARGET}/release/topowall.exe"
          "$bin" gpus
          "$bin" render web/studio/assets/yosemite.topo --palette rose-pine --size 320x200 -o smoke.png
          test -s smoke.png
      - name: Package
        shell: bash
        run: |
          name="topowall-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/topowall.exe" LICENSE crates/kit/palettes/LICENSE-tinted-theming "dist/$name/"
          cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null && rm -rf "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: aarch64-pc-windows-msvc
          path: dist/*

  # Built on Alpine and dynamically linked against musl: a fully static binary
  # can't load GPU drivers (Vulkan / OpenGL) at runtime.
  build-musl:
    if: github.event_name == 'push' || inputs.builds == 'all' || inputs.builds == 'musl'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build and smoke-test on Alpine
        run: |
          docker run --rm -v "$PWD":/src -w /src -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" alpine:3.22 sh -euc '
            apk add --no-cache build-base curl perl linux-headers file \
              vulkan-loader mesa-vulkan-swrast mesa-dri-gallium mesa-egl
            curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal
            . /root/.cargo/env
            RUSTFLAGS="-C target-feature=-crt-static" cargo build --release --locked -p topowall
            file target/release/topowall | grep -q "interpreter /lib/ld-musl"
            XDG_RUNTIME_DIR=/tmp ./target/release/topowall render web/studio/assets/yosemite.topo \
              --palette rose-pine --size 320x200 -o /tmp/smoke.png
            test -s /tmp/smoke.png
            chown -R "$HOST_UID:$HOST_GID" target
          '
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="topowall-${TARGET}"
          mkdir -p "dist/$name"
          cp target/release/topowall LICENSE crates/kit/palettes/LICENSE-tinted-theming "dist/$name/"
          cd dist && tar czf "$name.tar.gz" "$name" && rm -rf "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  studio:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the studio (code only, no sample map or images)
        run: |
          name="topowall-studio"
          mkdir -p "dist/$name/web/studio"
          cp -r web/src "dist/$name/web/"
          cp web/studio/index.html web/studio/studio.js web/studio/studio.css web/studio/presets.json "dist/$name/web/studio/"
          cp LICENSE "dist/$name/"
          cat > "dist/$name/README.txt" <<'TXT'
          topowall studio

          Serve this folder with any static file server, then open /web/studio/:

            python3 -m http.server 8000
            http://localhost:8000/web/studio/

          Open or drop a .topo heightmap made with `topowall fetch`.
          TXT
          sed -i 's/^          //' "dist/$name/README.txt"
          cd dist && zip -qr "$name.zip" "$name" && rm -rf "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: studio
          path: dist/*

  release:
    if: github.event_name == 'push'
    needs: [build, build-windows-arm64, build-musl, studio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'MD'
          ## Downloads

          | Platform | File |
          |---|---|
          | Linux x86_64 | `topowall-x86_64-unknown-linux-gnu.tar.gz` |
          | Linux ARM64 | `topowall-aarch64-unknown-linux-gnu.tar.gz` |
          | Linux x86_64, musl (Alpine, Void musl, …) | `topowall-x86_64-unknown-linux-musl.tar.gz` |
          | Linux ARM64, musl | `topowall-aarch64-unknown-linux-musl.tar.gz` |
          | macOS Apple Silicon | `topowall-aarch64-apple-darwin.tar.gz` |
          | macOS Intel | `topowall-x86_64-apple-darwin.tar.gz` |
          | Windows x86_64 | `topowall-x86_64-pc-windows-msvc.zip` |
          | Windows ARM64 | `topowall-aarch64-pc-windows-msvc.zip` |
          | Studio (browser GUI) | `topowall-studio.zip` |

          Each CLI archive contains only the `topowall` binary and licenses. It runs on
          dedicated and integrated GPUs (Intel, AMD, NVIDIA, Apple) through Vulkan, Metal,
          DX12 or OpenGL, and falls back to software rendering without a GPU driver.
          Verify downloads with `SHA256SUMS`.

          See the [README](https://github.com/${{ github.repository }}#readme) for usage.
          MD
          sed -i 's/^          //' notes.md
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "topowall ${{ github.ref_name }}" \
            --notes-file notes.md

  add-builds:
    needs: [build-windows-arm64, build-musl]
    if: >-
      always() && github.event_name == 'workflow_dispatch'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload builds the release doesn't have yet
        run: |
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' > existing.txt
          : > added.txt
          for f in dist/*; do
            name=$(basename "$f")
            if grep -qxF "$name" existing.txt; then
              echo "already in $TAG: $name (left unchanged)"
            else
              gh release upload "$TAG" "$f" --repo "$REPO"
              echo "$name" >> added.txt
            fi
          done
          if [ -s added.txt ]; then
            gh release download "$TAG" --repo "$REPO" --pattern SHA256SUMS --dir old
            (cd dist && xargs sha256sum -- < ../added.txt) > new.sums
            grep -vFf added.txt old/SHA256SUMS | cat - new.sums > SHA256SUMS
            gh release upload "$TAG" SHA256SUMS --repo "$REPO" --clobber
          fi
      - name: Add rows for new builds to the downloads table
        run: |
          [ -s added.txt ] || exit 0
          gh release view "$TAG" --repo "$REPO" --json body --jq .body > notes.md
          label() {
            case "$1" in
              topowall-x86_64-unknown-linux-musl.tar.gz)  echo "Linux x86_64, musl (Alpine, Void musl, …)" ;;
              topowall-aarch64-unknown-linux-musl.tar.gz) echo "Linux ARM64, musl" ;;
              topowall-aarch64-pc-windows-msvc.zip)       echo "Windows ARM64" ;;
              *) echo "$1" ;;
            esac
          }
          rows=""
          while read -r name; do
            grep -qF "\`$name\`" notes.md || rows="${rows}| $(label "$name") | \`$name\` |"$'\n'
          done < added.txt
          [ -n "$rows" ] || exit 0
          printf '%s' "$rows" > rows.md
          awk 'FNR == NR { r = r $0 "\n"; next } /^\| Studio/ && !done { printf "%s", r; done = 1 } { print }' rows.md notes.md > new.md
          gh release edit "$TAG" --repo "$REPO" --notes-file new.md
