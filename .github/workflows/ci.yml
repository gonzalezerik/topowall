name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Software graphics drivers (Linux runners have no GPU)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libgl1-mesa-dri libegl1
      - name: Test (renders on the runner's GPU or software renderer)
        run: cargo test --workspace
        env:
          TOPOWALL_REQUIRE_GPU: "1"
      - name: Render through OpenGL too
        if: runner.os == 'Linux'
        run: cargo test -p topowall-render --test gpu
        env:
          TOPOWALL_REQUIRE_GPU: "1"
          TOPOWALL_BACKEND: gl
      - name: CLI smoke test
        shell: bash
        run: |
          cargo run --release -p topowall -- gpus
          cargo run --release -p topowall -- render web/studio/assets/yosemite.topo --palette rose-pine --size 640x400 -o smoke.png
          test -s smoke.png
      - run: cargo clippy --workspace --all-targets -- -D warnings

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test web/test/*.test.js
