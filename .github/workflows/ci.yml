name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Make sure clang is available (the TLS library needs it on ARM64 Windows)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "$llvm\clang.exe")) { choco install llvm -y --no-progress }
            Add-Content $env:GITHUB_PATH $llvm
          }
      - uses: Swatinem/rust-cache@v2
      - name: Software graphics drivers (Linux runners have no GPU)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libgl1-mesa-dri libegl1
      - name: Test (renders on the runner's GPU or software renderer)
        run: cargo test --workspace
        env:
          TOPOWALL_REQUIRE_GPU: "1"
      - name: Render through OpenGL too
        if: runner.os == 'Linux'
        run: cargo test -p topowall-render --test gpu
        env:
          TOPOWALL_REQUIRE_GPU: "1"
          TOPOWALL_BACKEND: gl
      - name: CLI smoke test
        shell: bash
        run: |
          cargo run --release -p topowall -- gpus
          cargo run --release -p topowall -- render web/test/assets/yosemite.topo --palette rose-pine --size 640x400 -o smoke.png
          test -s smoke.png
          cargo run --release -p topowall -- palettes --filter dark,cool --color always
          cargo run --release -p topowall -- preview rose-pine --size 40x20 > preview.txt
          test -s preview.txt
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Web app data matches the command-line app
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p topowall
          scripts/web-presets.sh
          git diff --exit-code -- web/

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test web/test/*.test.js
      - name: The app's copy of the palette catalog is current
        run: cmp crates/kit/palettes/palettes.json web/app/data/palettes.json
      - name: Assemble the web app
        run: scripts/web-dist.sh dist/topowall

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the web app image
        run: docker build -f deploy/Containerfile -t topowall-web .
      - name: Serve it read-only as a non-root user and check the responses
        run: |
          docker run -d --name web --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -p 8080:8080 topowall-web
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/topowall/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/topowall/src/terrain.js)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/topowall/)" = 405
          curl -sI http://127.0.0.1:8080/topowall/ | grep -qi "^content-security-policy: default-src 'self'"
          docker logs web

  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test on Alpine (musl) with Mesa software Vulkan and OpenGL
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -euc '
            apk add --no-cache build-base curl perl linux-headers \
              vulkan-loader mesa-vulkan-swrast mesa-dri-gallium mesa-egl
            curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal
            . /root/.cargo/env
            export RUSTFLAGS="-C target-feature=-crt-static" TOPOWALL_REQUIRE_GPU=1 XDG_RUNTIME_DIR=/tmp
            cargo test --locked --workspace
            TOPOWALL_BACKEND=gl cargo test --locked -p topowall-render --test gpu
          '
