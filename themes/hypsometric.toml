# Lines colored by elevation: valleys in deep teal, peaks in warm sand.
name = "Hypsometric"
background = "#0b0d10"

[[lines]]
every = 20
width = 1.25
opacity = 0.55
color = [
  { at = "0%",   color = "oklch(0.45 0.06 190)" },
  { at = "50%",  color = "oklch(0.55 0.05 140)" },
  { at = "100%", color = "oklch(0.70 0.06 80)" },
]

[[lines]]
every = 100
width = 1.8
color = [
  { at = "0%",   color = "oklch(0.65 0.08 190)" },
  { at = "50%",  color = "oklch(0.75 0.07 140)" },
  { at = "100%", color = "oklch(0.88 0.07 80)" },
]
